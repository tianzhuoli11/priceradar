<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>P2-D price bottom-bar fixture</title>
  <meta name="viewport" content="width=390, initial-scale=1" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f7f7f7; }
    .top { height: 120px; background: #ddd; padding: 12px; }
    .block { height: 520px; background: #eee; margin: 8px; }
    .price-row {
      margin: 8px;
      padding: 12px;
      background: #fff;
      border: 1px solid #ccc;
    }
    .label { color: #666; font-size: 14px; margin-bottom: 6px; }
    #main_price {
      display: inline-block;
      color: #e4393c;
      font-size: 28px;
      line-height: 1;
      height: 22px;
      overflow: visible;
    }
    #main_price em { font-style: normal; font-size: 34px; }
    #main_price .price_decimals { font-size: 18px; }
    .more { height: 800px; background: #f0f0f0; margin: 8px; }
    /* Simulates JD fixed bottom checkout bar covering lower viewport. */
    #fixed_buy_bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      z-index: 1000;
      background: rgba(200, 40, 40, 0.92);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="top">fixture top</div>
  <div class="block">content above price</div>
  <div class="price-row">
    <div class="label">售价</div>
    <div id="main_price"><span>¥<em>168</em><span class="price_decimals">.00</span></span></div>
  </div>
  <div class="more">content below price</div>
  <div id="fixed_buy_bar">立即购买（固定底栏）</div>
  <script>
    // Place price near the bottom of the initial viewport so the fixed bar
    // overlaps it until the capture flow recenters.
    window.addEventListener('load', () => {
      const el = document.querySelector('#main_price');
      const r = el.getBoundingClientRect();
      const targetTop = window.scrollY + r.top - (window.innerHeight - 80);
      window.scrollTo(0, Math.max(0, targetTop));
    });
  </script>
</body>
</html>
